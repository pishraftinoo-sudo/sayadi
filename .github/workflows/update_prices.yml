name: Update Catalyst Prices

on:
  schedule:
    - cron: '0 */1 * * *' # هر 2 ساعت یک‌بار اجرا شود
  workflow_dispatch: # امکان اجرای دستی برای تست

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          TARGET_JSON_PATH: "prices.json"  # نام جدید و ایمن
          SYNC_URL: "https://www.sayadicatalyst.com/smart-sync.php"
          SYNC_KEY: "sayadi-smart-ppm-2026"
        run: python bot.py
