name: Auto Price Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        # ارتقا به نسخه 4.2.2 یا بالاتر که با Node 24 سازگار است
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        # استفاده از نسخه v5.3.0 یا بالاتر
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # استفاده از نسخه جدیدتر پایتون برای پایداری بیشتر

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Script
        run: python bot.py
